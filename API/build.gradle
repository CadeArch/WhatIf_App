plugins {
    id 'com.android.library'
}

android {
    namespace 'com.CadeMixedUpGame.api'
    compileSdk 36

    // gives us ObservableArrayList
    buildFeatures {
        dataBinding true
    }

    defaultConfig {
        minSdkVersion 25
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // firebase
    implementation platform('com.google.firebase:firebase-bom:26.5.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'

    // gives us view model
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.3.0"

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    testImplementation 'junit:junit:4.+'
    testImplementation 'androidx.arch.core:core-testing:2.1.0'
    // Robolectric: lets Firebase-backed multiplayer scenarios run as plain fast JVM tests (real
    // Context, no emulator/device) against the local Firebase Emulator Suite. See CHANGELOG.md's
    // "Tier A" multiplayer harness design notes.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    // Bumped from 1.1.2/3.3.0 (2020) to match MixedUp/build.gradle — those versions predate the
    // API 31+ requirement for explicit android:exported on their bundled helper activities.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
