plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.CadeMixedUpGame.phoneapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.CadeMixedUpGame.phoneapp"
        minSdkVersion 25
        targetSdkVersion 36
        versionCode 10
        versionName "2.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Opt-in only: ./gradlew assembleDebug -PuseFirebaseEmulator=true points the app at the
        // local Firebase Emulator Suite (see firebase.json) instead of the live production
        // database. Defaults to false so normal builds/dev behavior is unchanged.
        buildConfigField "boolean", "USE_FIREBASE_EMULATOR", project.hasProperty('useFirebaseEmulator') ? 'true' : 'false'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':API')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    def fragment_version = "1.3.3"
    implementation "androidx.fragment:fragment:$fragment_version"
    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:28.4.1')

    // Declare the dependency for the Firebase Authentication library
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    // Explicit bump: transitively resolved androidx.core was 1.3.1, which predates
    // WindowInsetsCompat.Type (added in 1.5.0) needed for mandatory edge-to-edge inset handling.
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.+'
    // Bumped from 1.1.2/3.3.0 (2020): those versions' bundled helper-activity manifests predate
    // the API 31+ requirement for explicit android:exported, which fails manifest merging once
    // targeting API 36.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
